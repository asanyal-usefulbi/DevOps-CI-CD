name: Terraform CI/CD with OIDC, Distributed PR Approvals

on:
  pull_request:
    branches: [ dist-workflow ]
  push:
    branches: [ dist-workflow ]

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.14.1"
  WORKING_DIR: "./terraform"
  AWS_REGION: "ap-south-1"

# ---------------------------------------
# PR VALIDATION (Runs on pull_request)
# ---------------------------------------
jobs:
  pr-validate:
    if: github.event_name == 'pull_request'
    name: Validate Terraform (PR)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Talisman Secret Scan
        uses: docker://thoughtworks/talisman:latest
        with:
          args: -g pre-commit -i .

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform validate

      - name: tfsec Scan (Fail on HIGH)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ env.WORKING_DIR }}
          args: --minimum-severity HIGH

      - name: Install Semgrep
        run: pip install semgrep

      - name: Semgrep Full Scan (fail on high severity)
        run: semgrep scan \
              --config auto \
              --severity error \
              --error \
              --include '**/*'

      - name: Terraform Plan (for PR review)
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform plan

# ---------------------------------------
# APPLY AFTER PR MERGE (Distributed Approval)
# ---------------------------------------
  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Terraform Apply (After Team PR Approval)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init

      - name: Terraform Apply
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform apply -auto-approve

